<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apps Script API Tester - Compact Fit</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-gradient: linear-gradient(135deg, #f3f4f6 0%, #e5e7eb 100%);
            --chat-bg: #ffffff;
            --text-main: #1f2937;
            --text-secondary: #4b5563;
            --border-color: #e5e7eb;
            --code-bg: #1e293b;
            --code-text: #e2e8f0;
            --radius-lg: 12px;
            --radius-md: 8px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* Khóa toàn màn hình, không cho cuộn trang ngoài */
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            padding: 6px;
        }

        @media (min-width: 768px) {
            body {
                padding: 12px;
            }
        }

        .chat-container {
            width: 100%;
            max-width: 750px;
            height: 100%;
            max-height: 850px;
            background-color: var(--chat-bg);
            border-radius: var(--radius-lg);
            box-shadow: 0 8px 20px -4px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* Header gọn gàng */
        .header {
            padding: 8px 14px;
            background-color: #ffffff;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex-shrink: 0;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-title-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .header-title::before {
            content: '';
            display: inline-block;
            width: 7px;
            height: 7px;
            background-color: #22c55e;
            border-radius: 50%;
        }

        .settings-icon-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 15px;
            padding: 2px 4px;
            border-radius: 4px;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .settings-icon-btn:hover {
            background-color: #f3f4f6;
        }

        .header-actions {
            display: flex;
            gap: 6px;
        }

        .btn {
            background-color: #f3f4f6;
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
            padding: 4px 10px;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-size: 11px;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .btn:hover {
            background-color: #e5e7eb;
            color: var(--text-main);
        }

        .btn-danger {
            background-color: #fef2f2;
            color: #dc2626;
            border-color: #fecaca;
        }
        .btn-danger:hover {
            background-color: #fee2e2;
            color: #b91c1c;
        }

        .api-config-panel {
            display: none;
            flex-direction: column;
            gap: 4px;
        }

        .api-config-panel input {
            width: 100%;
            padding: 6px 10px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            outline: none;
            font-size: 12px;
            color: var(--text-main);
            background-color: #f9fafb;
        }

        .api-config-panel input:focus {
            border-color: var(--primary);
            background-color: #fff;
        }

        /* Khung chat chiếm tối đa không gian còn lại */
        .chat-window {
            flex: 1;
            padding: 12px 14px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background-color: #fafafa;
        }

        /* Cỡ chữ nhỏ gọn (11px), tối ưu hiển thị JSON */
        .message {
            max-width: 90%;
            padding: 8px 12px;
            border-radius: 10px;
            line-height: 1.4;
            word-wrap: break-word;
            white-space: pre-wrap;
            box-shadow: 0 1px 2px rgba(0,0,0,0.04);
            font-size: 11px; 
        }

        .message.user {
            align-self: flex-end;
            background-color: var(--primary);
            color: white;
            border-bottom-right-radius: 3px;
            font-family: ui-monospace, monospace;
        }

        .message.bot {
            align-self: flex-start;
            background-color: var(--code-bg);
            color: var(--code-text);
            border-bottom-left-radius: 3px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        }

        .message.error {
            background-color: #fef2f2;
            color: #dc2626;
            border: 1px solid #fecaca;
            font-family: sans-serif;
        }

        /* Dropdown lịch sử mẫu cũ nằm ngay góc dưới phía trên khung nhập */
        .history-dropdown {
            position: absolute;
            bottom: 60px;
            left: 14px;
            right: 60px;
            max-height: 200px;
            background: white;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            box-shadow: 0 8px 20px -4px rgba(0,0,0,0.15);
            overflow-y: auto;
            display: none;
            z-index: 100;
            padding: 10px;
        }

        .history-dropdown-header {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 6px;
            padding-bottom: 4px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .history-item {
            padding: 6px 8px;
            background: #f8fafc;
            border: 1px solid #f1f5f9;
            border-radius: 6px;
            margin-bottom: 6px;
            font-size: 11px;
            cursor: pointer;
            word-break: break-all;
            font-family: ui-monospace, monospace;
        }

        .history-item:hover {
            background: #f1f5f9;
            border-color: #cbd5e1;
        }

        /* Khu vực nhập liệu cố định gọn gàng bên dưới */
        .input-area {
            padding: 8px 14px;
            background-color: #ffffff;
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 6px;
            align-items: flex-end;
            flex-shrink: 0;
            position: relative;
        }

        .input-area textarea {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: 18px;
            outline: none;
            resize: none;
            font-family: inherit;
            font-size: 12px;
            max-height: 100px;
            overflow-y: auto;
            line-height: 1.4;
            background-color: #f9fafb;
            transition: border-color 0.2s;
        }

        .input-area textarea:focus {
            border-color: var(--primary);
            background-color: #fff;
        }

        /* Nút icon mở mẫu cũ nằm ngay chỗ nhập tin nhắn */
        .icon-action-btn {
            background: #f3f4f6;
            border: 1px solid var(--border-color);
            border-radius: 50%;
            width: 36px;
            height: 36px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
            font-size: 15px;
            transition: background 0.2s;
        }
        .icon-action-btn:hover {
            background-color: #e5e7eb;
        }

        .input-area button.send-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
            transition: background-color 0.2s, transform 0.1s;
        }

        .input-area button.send-btn:hover {
            background-color: var(--primary-hover);
        }

        .input-area button.send-btn svg {
            width: 15px;
            height: 15px;
            fill: white;
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <!-- Bảng chọn nhanh lịch sử mẫu cũ nằm gần khung nhập -->
        <div class="history-dropdown" id="historyDropdown">
            <div class="history-dropdown-header">
                <span>Chọn mẫu tin nhắn đã gửi trước đó:</span>
                <span style="cursor:pointer; color: #dc2626; font-weight: 500;" onclick="toggleHistoryMenu()">✕ Đóng</span>
            </div>
            <div id="historyListContainer"></div>
        </div>

        <div class="header">
            <div class="header-top">
                <div class="header-title-wrapper">
                    <span class="header-title">Apps Script API</span>
                    <button class="settings-icon-btn" onclick="toggleApiPanel()" title="Cài đặt URL API">⚙️</button>
                </div>
                <div class="header-actions">
                    <button class="btn btn-danger" onclick="clearHistory()">Xóa lịch sử</button>
                </div>
            </div>
            
            <div class="api-config-panel" id="apiConfigPanel">
                <input type="text" id="apiUrl" placeholder="Dán URL Web App Apps Script vào đây (https://script.google.com/.../exec)" onchange="saveConfig()">
            </div>
        </div>

        <div class="chat-window" id="chatWindow"></div>

        <div class="input-area">
            <!-- Icon mẫu cũ đặt gọn gàng ở đây -->
            <button class="icon-action-btn" onclick="toggleHistoryMenu()" title="Chọn mẫu tin nhắn đã gửi">📂</button>
            
            <textarea id="messageInput" placeholder="Nhập nội dung hoặc JSON... (Shift+Enter xuống dòng)" rows="1" oninput="autoResizeTextarea(this)" onkeydown="handleEnter(event)"></textarea>
            
            <button class="send-btn" onclick="sendMessage()" title="Gửi tin nhắn">
                <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path></svg>
            </button>
        </div>
    </div>

    <script>
        const chatWindow = document.getElementById('chatWindow');
        const messageInput = document.getElementById('messageInput');
        const apiUrlInput = document.getElementById('apiUrl');
        const apiConfigPanel = document.getElementById('apiConfigPanel');
        const historyDropdown = document.getElementById('historyDropdown');
        const historyListContainer = document.getElementById('historyListContainer');
        
        let chatHistory = [];
        let sentMessagesList = [];

        window.onload = function() {
            const savedUrl = localStorage.getItem('appsScriptUrl');
            if (savedUrl) {
                apiUrlInput.value = savedUrl;
            } else {
                apiConfigPanel.style.display = 'flex';
            }

            const savedHistory = localStorage.getItem('chatHistoryJsonV10');
            if (savedHistory) {
                try {
                    chatHistory = JSON.parse(savedHistory);
                    renderHistory();
                } catch (e) {
                    chatHistory = [];
                }
            } else {
                appendMessage('bot', '{\n  "status": "ready",\n  "message": "Sẵn sàng. Nhấn vào icon ⚙️ ở góc trên để dán URL API."\n}');
            }

            const savedSent = localStorage.getItem('sentMessagesListV10');
            if (savedSent) {
                try {
                    sentMessagesList = JSON.parse(savedSent);
                } catch (e) {
                    sentMessagesList = [];
                }
            }
        };

        function saveConfig() { 
            localStorage.setItem('appsScriptUrl', apiUrlInput.value.trim()); 
        }
        
        function toggleApiPanel() {
            if (apiConfigPanel.style.display === 'flex') {
                apiConfigPanel.style.display = 'none';
            } else {
                apiConfigPanel.style.display = 'flex';
                apiUrlInput.focus();
            }
        }

        function saveHistory() { 
            localStorage.setItem('chatHistoryJsonV10', JSON.stringify(chatHistory)); 
            localStorage.setItem('sentMessagesListV10', JSON.stringify(sentMessagesList));
        }

        function clearHistory() {
            if(confirm('Xóa toàn bộ lịch sử và danh sách mẫu đã gửi?')) {
                chatHistory = [];
                sentMessagesList = [];
                saveHistory();
                chatWindow.innerHTML = '';
                historyDropdown.style.display = 'none';
            }
        }

        function toggleHistoryMenu() {
            if (historyDropdown.style.display === 'block') {
                historyDropdown.style.display = 'none';
            } else {
                renderHistoryDropdownList();
                historyDropdown.style.display = 'block';
            }
        }

        function renderHistoryDropdownList() {
            historyListContainer.innerHTML = '';
            if (sentMessagesList.length === 0) {
                historyListContainer.innerHTML = '<div style="padding: 8px; color: #6b7280; font-size: 11px; text-align: center;">Chưa có mẫu tin nhắn nào được lưu.</div>';
                return;
            }

            const recentMsgs = [...sentMessagesList].reverse();
            recentMsgs.forEach(msg => {
                const item = document.createElement('div');
                item.className = 'history-item';
                item.textContent = msg;
                item.onclick = () => {
                    messageInput.value = msg;
                    autoResizeTextarea(messageInput);
                    historyDropdown.style.display = 'none';
                    messageInput.focus();
                };
                historyListContainer.appendChild(item);
            });
        }

        function autoResizeTextarea(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = Math.min(textarea.scrollHeight, 100) + 'px';
        }

        function handleEnter(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        function appendMessage(sender, text, isError = false) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender} ${isError ? 'error' : ''}`;
            msgDiv.textContent = text;
            chatWindow.appendChild(msgDiv);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        function renderHistory() {
            chatWindow.innerHTML = '';
            chatHistory.forEach(msg => appendMessage(msg.sender, msg.text, msg.isError));
        }

        async function sendMessage() {
            let rawText = messageInput.value.trim();
            const url = apiUrlInput.value.trim();

            if (!rawText) return;
            if (!url) { 
                alert("Vui lòng nhập URL Apps Script bằng cách bấm vào icon ⚙️ ở góc trên!"); 
                apiConfigPanel.style.display = 'flex';
                apiUrlInput.focus();
                return; 
            }

            historyDropdown.style.display = 'none';

            let payloadToSend = rawText;
            try {
                const parsed = JSON.parse(rawText);
                payloadToSend = JSON.stringify(parsed, null, 2);
            } catch (e) {
                payloadToSend = JSON.stringify({ message: rawText }, null, 2);
            }

            if (!sentMessagesList.includes(payloadToSend)) {
                sentMessagesList.push(payloadToSend);
            }

            appendMessage('user', payloadToSend);
            chatHistory.push({ sender: 'user', text: payloadToSend });
            
            messageInput.value = '';
            messageInput.style.height = 'auto';
            saveHistory();
            chatWindow.scrollTop = chatWindow.scrollHeight;

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: payloadToSend
                });

                const responseText = await response.text();
                
                let formattedJsonText = responseText;
                try {
                    const jsonObject = JSON.parse(responseText);
                    formattedJsonText = JSON.stringify(jsonObject, null, 2);
                } catch (e) {}

                appendMessage('bot', formattedJsonText);
                chatHistory.push({ sender: 'bot', text: formattedJsonText });

            } catch (error) {
                const errorMsg = `Lỗi kết nối: ${error.message}`;
                appendMessage('bot', errorMsg, true);
                chatHistory.push({ sender: 'bot', text: errorMsg, isError: true });
            } finally {
                saveHistory();
            }
        }
    </script>
</body>
</html>
