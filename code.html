<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apps Script API Modern Chat</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-gradient: linear-gradient(135deg, #f3f4f6 0%, #e5e7eb 100%);
            --chat-bg: #ffffff;
            --text-main: #1f2937;
            --text-secondary: #4b5563;
            --border-color: #e5e7eb;
            --code-bg: #1e293b;
            --code-text: #e2e8f0;
            --radius-lg: 16px;
            --radius-md: 10px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }

        @media (min-width: 768px) {
            body {
                padding: 20px;
            }
        }

        .chat-container {
            width: 100%;
            max-width: 750px;
            height: 95vh;
            max-height: 900px;
            background-color: var(--chat-bg);
            border-radius: var(--radius-lg);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* Header Style */
        .header {
            padding: 14px 20px;
            background-color: #ffffff;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header-title::before {
            content: '';
            display: inline-block;
            width: 10px;
            height: 10px;
            background-color: #22c55e;
            border-radius: 50%;
        }

        .header-actions {
            display: flex;
            gap: 8px;
        }

        .btn {
            background-color: #f3f4f6;
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .btn:hover {
            background-color: #e5e7eb;
            color: var(--text-main);
        }

        .btn-danger {
            background-color: #fef2f2;
            color: #dc2626;
            border-color: #fecaca;
        }
        .btn-danger:hover {
            background-color: #fee2e2;
            color: #b91c1c;
        }

        .header input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            outline: none;
            font-size: 14px;
            color: var(--text-main);
            background-color: #f9fafb;
            transition: border-color 0.2s;
        }

        .header input:focus {
            border-color: var(--primary);
            background-color: #fff;
        }

        /* Chat Window Style */
        .chat-window {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            background-color: #fafafa;
        }

        .message {
            max-width: 88%;
            padding: 12px 16px;
            border-radius: 14px;
            font-size: 14px;
            line-height: 1.6;
            word-wrap: break-word;
            white-space: pre-wrap;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }

        .message.user {
            align-self: flex-end;
            background-color: var(--primary);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.bot {
            align-self: flex-start;
            background-color: var(--code-bg);
            color: var(--code-text);
            border-bottom-left-radius: 4px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 13px;
        }

        .message.error {
            background-color: #fef2f2;
            color: #dc2626;
            border: 1px solid #fecaca;
            font-family: sans-serif;
        }

        /* Dropdown lịch sử mẫu cũ */
        .history-dropdown {
            position: absolute;
            bottom: 75px;
            left: 15px;
            right: 15px;
            max-height: 280px;
            background: white;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.15);
            overflow-y: auto;
            display: none;
            z-index: 100;
            padding: 12px;
            animation: slideUp 0.2s ease-out;
        }

        @keyframes slideUp {
            from { transform: translateY(10px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .history-dropdown-header {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 10px;
            padding-bottom: 6px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .history-item {
            padding: 10px 12px;
            background: #f8fafc;
            border: 1px solid #f1f5f9;
            border-radius: var(--radius-md);
            margin-bottom: 8px;
            font-size: 13px;
            cursor: pointer;
            word-break: break-all;
            transition: 0.2s;
            font-family: ui-monospace, monospace;
        }

        .history-item:hover {
            background: #f1f5f9;
            border-color: #cbd5e1;
        }

        /* Input Area Style */
        .input-area {
            padding: 14px 20px;
            background-color: #ffffff;
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 10px;
            align-items: flex-end;
            position: relative;
        }

        .input-area textarea {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            outline: none;
            resize: none;
            font-family: inherit;
            font-size: 14px;
            max-height: 160px;
            overflow-y: auto;
            line-height: 1.5;
            background-color: #f9fafb;
            transition: border-color 0.2s, background-color 0.2s;
        }

        .input-area textarea:focus {
            border-color: var(--primary);
            background-color: #fff;
        }

        .input-area button.send-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 50%;
            width: 44px;
            height: 44px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
            transition: background-color 0.2s, transform 0.1s;
        }

        .input-area button.send-btn:hover {
            background-color: var(--primary-hover);
        }

        .input-area button.send-btn:active {
            transform: scale(0.95);
        }

        .input-area button.send-btn svg {
            width: 18px;
            height: 18px;
            fill: white;
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <!-- Bảng chọn nhanh lịch sử mẫu cũ -->
        <div class="history-dropdown" id="historyDropdown">
            <div class="history-dropdown-header">
                <span>Chọn mẫu tin nhắn đã gửi trước đó:</span>
                <span style="cursor:pointer; color: #dc2626; font-weight: 500;" onclick="toggleHistoryMenu()">✕ Đóng</span>
            </div>
            <div id="historyListContainer"></div>
        </div>

        <div class="header">
            <div class="header-top">
                <span class="header-title">Apps Script API Tester</span>
                <div class="header-actions">
                    <button class="btn" onclick="toggleHistoryMenu()">📂 Mẫu cũ</button>
                    <button class="btn btn-danger" onclick="clearHistory()">Xóa lịch sử</button>
                </div>
            </div>
            <input type="text" id="apiUrl" placeholder="Dán URL Web App Apps Script vào đây..." onchange="saveConfig()">
        </div>

        <div class="chat-window" id="chatWindow"></div>

        <div class="input-area">
            <textarea id="messageInput" placeholder="Nhập nội dung hoặc JSON... (Shift+Enter xuống dòng)" rows="1" oninput="autoResizeTextarea(this)" onkeydown="handleEnter(event)"></textarea>
            <button class="send-btn" onclick="sendMessage()" title="Gửi tin nhắn">
                <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path></svg>
            </button>
        </div>
    </div>

    <script>
        const chatWindow = document.getElementById('chatWindow');
        const messageInput = document.getElementById('messageInput');
        const apiUrlInput = document.getElementById('apiUrl');
        const historyDropdown = document.getElementById('historyDropdown');
        const historyListContainer = document.getElementById('historyListContainer');
        
        let chatHistory = [];
        let sentMessagesList = [];

        window.onload = function() {
            const savedUrl = localStorage.getItem('appsScriptUrl');
            if (savedUrl) apiUrlInput.value = savedUrl;

            const savedHistory = localStorage.getItem('chatHistoryModernV5');
            if (savedHistory) {
                chatHistory = JSON.parse(savedHistory);
                renderHistory();
            } else {
                appendMessage('bot', '{\n  "status": "ready",\n  "message": "Giao diện đã sẵn sàng kết nối API."\n}');
            }

            const savedSent = localStorage.getItem('sentMessagesListV5');
            if (savedSent) {
                sentMessagesList = JSON.parse(savedSent);
            }
        };

        function saveConfig() { localStorage.setItem('appsScriptUrl', apiUrlInput.value.trim()); }
        
        function saveHistory() { 
            localStorage.setItem('chatHistoryModernV5', JSON.stringify(chatHistory)); 
            localStorage.setItem('sentMessagesListV5', JSON.stringify(sentMessagesList));
        }

        function clearHistory() {
            if(confirm('Xóa toàn bộ lịch sử và danh sách mẫu đã gửi?')) {
                chatHistory = [];
                sentMessagesList = [];
                saveHistory();
                chatWindow.innerHTML = '';
                historyDropdown.style.display = 'none';
            }
        }

        function toggleHistoryMenu() {
            if (historyDropdown.style.display === 'block') {
                historyDropdown.style.display = 'none';
            } else {
                renderHistoryDropdownList();
                historyDropdown.style.display = 'block';
            }
        }

        function renderHistoryDropdownList() {
            historyListContainer.innerHTML = '';
            if (sentMessagesList.length === 0) {
                historyListContainer.innerHTML = '<div style="padding: 12px; color: #6b7280; font-size: 13px; text-align: center;">Chưa có mẫu tin nhắn nào được lưu.</div>';
                return;
            }

            const recentMsgs = [...sentMessagesList].reverse();
            recentMsgs.forEach(msg => {
                const item = document.createElement('div');
                item.className = 'history-item';
                item.textContent = msg;
                item.onclick = () => {
                    messageInput.value = msg;
                    autoResizeTextarea(messageInput);
                    historyDropdown.style.display = 'none';
                    messageInput.focus();
                };
                historyListContainer.appendChild(item);
            });
        }

        function autoResizeTextarea(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = Math.min(textarea.scrollHeight, 160) + 'px';
        }

        function handleEnter(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        function appendMessage(sender, text, isError = false) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender} ${isError ? 'error' : ''}`;
            msgDiv.textContent = text;
            chatWindow.appendChild(msgDiv);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        function renderHistory() {
            chatWindow.innerHTML = '';
            chatHistory.forEach(msg => appendMessage(msg.sender, msg.text, msg.isError));
        }

        async function sendMessage() {
            const exactText = messageInput.value;
            const url = apiUrlInput.value.trim();

            if (!exactText.trim()) return;
            if (!url) { alert("Vui lòng nhập URL Apps Script trước!"); return; }

            historyDropdown.style.display = 'none';

            if (!sentMessagesList.includes(exactText)) {
                sentMessagesList.push(exactText);
            }

            appendMessage('user', exactText);
            chatHistory.push({ sender: 'user', text: exactText });
            
            messageInput.value = '';
            messageInput.style.height = 'auto';
            saveHistory();
            chatWindow.scrollTop = chatWindow.scrollHeight;

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: exactText
                });

                const responseText = await response.text();
                
                // Tự động chuyển đổi phản hồi sang định dạng JSON có xuống dòng & thụt lề chuẩn
                let formattedJsonText = responseText;
                try {
                    const jsonObject = JSON.parse(responseText);
                    formattedJsonText = JSON.stringify(jsonObject, null, 2);
                } catch (e) {
                    // Giữ nguyên văn bản thô nếu không phải JSON
                }

                appendMessage('bot', formattedJsonText);
                chatHistory.push({ sender: 'bot', text: formattedJsonText });

            } catch (error) {
                const errorMsg = `Lỗi kết nối: ${error.message}`;
                appendMessage('bot', errorMsg, true);
                chatHistory.push({ sender: 'bot', text: errorMsg, isError: true });
            } finally {
                saveHistory();
            }
        }
    </script>
</body>
</html>
