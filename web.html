<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Xác nhận thanh toán</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f4f5f7;
            -webkit-tap-highlight-color: transparent;
        }
        /* Hiệu ứng xoay cho icon loading */
        .spinner {
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <!-- Container thẻ thanh toán -->
    <div class="bg-white w-full max-w-md rounded-3xl shadow-xl overflow-hidden border border-gray-100">
        
        <!-- Header màu xanh dương -->
        <div class="bg-[#1250dc] px-6 py-10 text-center relative">
            <div class="relative z-10 flex flex-col items-center">
                <!-- Icon Check -->
                <div class="w-16 h-16 bg-white rounded-full flex items-center justify-center mb-4 shadow-md text-[#1250dc]">
                    <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                        <polyline points="22 4 12 14.01 9 11.01"></polyline>
                    </svg>
                </div>
                <h1 class="text-white text-lg font-medium opacity-90 mb-1">Xác nhận thanh toán</h1>
                <p class="text-white text-4xl font-bold">2,000 VND</p>
            </div>
        </div>

        <!-- Thông tin giao dịch -->
        <div class="p-6">
            <h2 class="text-sm font-bold text-gray-600 mb-5 uppercase tracking-wider">Thông tin giao dịch</h2>
            
            <div class="space-y-5 text-sm">
                <!-- Dòng 1 -->
                <div class="flex justify-between items-center border-b border-gray-100 pb-4">
                    <span class="text-gray-500">Ngân hàng nhận</span>
                    <span class="font-bold text-gray-800 text-right text-base">MBBank</span>
                </div>
                
                <!-- Dòng 2 -->
                <div class="flex justify-between items-center border-b border-gray-100 pb-4">
                    <span class="text-gray-500">Số tài khoản</span>
                    <span class="font-mono font-bold text-gray-800 text-right text-base">2000</span>
                </div>
                
                <!-- Dòng 3 -->
                <div class="flex flex-col gap-2 pb-2">
                    <span class="text-gray-500">Nội dung chuyển khoản</span>
                    <div class="font-medium text-gray-800 bg-gray-50 p-3 rounded-xl border border-gray-100 break-words">
                        tra tien tra sua cho bo
                    </div>
                </div>
            </div>

            <!-- Nút Action -->
            <div class="mt-6">
                <!-- Thẻ a dùng làm nút bấm, mặc định đang ở trạng thái loading -->
                <a 
                    id="pay-button"
                    href="#" 
                    class="w-full flex items-center justify-center py-4 px-4 bg-[#1250dc] hover:bg-blue-800 text-white text-base font-bold rounded-xl transition-colors shadow-lg shadow-blue-500/30 opacity-70 cursor-not-allowed pointer-events-none"
                >
                    <!-- Icon Loading -->
                    <svg id="loader" class="spinner w-5 h-5 mr-2 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>

                    <span id="btn-text">Đang thiết lập...</span>

                    <!-- Icon Mũi tên (ẩn khi đang loading) -->
                    <svg id="btn-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="ml-2 hidden">
                        <path d="M5 12h14"></path>
                        <path d="m12 5 7 7-7 7"></path>
                    </svg>
                </a>
            </div>

            <!-- Footer -->
            <div class="mt-6 text-center bg-blue-50/50 p-3 rounded-lg">
                <p class="text-[13px] text-gray-500 leading-relaxed flex items-start gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="flex-shrink-0 mt-0.5 text-blue-500"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                    <span>Hệ thống sẽ tự động mở ứng dụng ngân hàng trên máy bạn. Vui lòng kiểm tra lại thông tin trước khi xác nhận trên App.</span>
                </p>
            </div>
        </div>
    </div>

    <script>
        // Link gốc của bạn
        const ORIGINAL_URL = 'https://dl.vietqr.io/pay?app=icb&am=2000&tn=tra+tien+tra+sua+cho+bo&ba=2000@MB&url=https://www.vietqr.io/deeplink';

        async function setupPaymentLink() {
            const btn = document.getElementById('pay-button');
            const btnText = document.getElementById('btn-text');
            const btnIcon = document.getElementById('btn-icon');
            const loader = document.getElementById('loader');

            try {
                // 1. Phân tích tham số 'app' từ URL gốc
                const urlObj = new URL(ORIGINAL_URL);
                const targetAppId = urlObj.searchParams.get('app') || 'icb';

                // 2. Phát hiện hệ điều hành Android
                const userAgent = navigator.userAgent || navigator.vendor || window.opera;
                const isAndroid = /android/i.test(userAgent);

                let finalHref = ORIGINAL_URL;

                // 3. Nếu là Android, cấu hình Intent URL để vượt qua In-app Browser của Zalo/Facebook
                if (isAndroid) {
                    // Lấy danh sách deeplink Android từ API VietQR
                    const response = await fetch('https://api.vietqr.io/v2/android-app-deeplinks');
                    const data = await response.json();
                    
                    // Xử lý cả 2 trường hợp data.apps hoặc data.data.apps tùy vào format trả về
                    const apps = data.apps || (data.data && data.data.apps) || data.data || [];
                    
                    // Tìm app theo appId (VD: icb)
                    const matchedApp = apps.find(a => 
                        a.appId && a.appId.toLowerCase() === targetAppId.toLowerCase()
                    );

                    // Mặc định package name của Vietinbank nếu không tìm thấy
                    let packageName = 'com.vietinbank.ipay';

                    // 4. Trích xuất package name từ chuỗi deeplink của API
                    if (matchedApp && matchedApp.deeplink) {
                        const packageMatch = matchedApp.deeplink.match(/package=([^;]+)/);
                        if (packageMatch && packageMatch[1]) {
                            packageName = packageMatch[1];
                        }
                    }

                    // 5. Build Intent URI chuẩn của Android
                    // Loại bỏ "https://" ở đầu URL gốc
                    const urlWithoutScheme = ORIGINAL_URL.replace(/^https?:\/\//, '');
                    // Encode URL gốc làm fallback (đề phòng máy ko có app ngân hàng)
                    const encodedFallback = encodeURIComponent(ORIGINAL_URL);
                    
                    // Cấu trúc intent ép mở app ngân hàng, nếu không có app sẽ bung ra trình duyệt bình thường
                    finalHref = `intent://${urlWithoutScheme}#Intent;scheme=https;package=${packageName};S.browser_fallback_url=${encodedFallback};end`;
                }
                // 6. Nếu là iOS hoặc Desktop, giữ nguyên URL gốc (iOS Universal link hoạt động tốt nếu user ấn trực tiếp)

                // 7. Cập nhật giao diện nút bấm
                enableButton(btn, btnText, btnIcon, loader, finalHref, "Mở App Ngân Hàng Ngay");

            } catch (error) {
                console.error("Lỗi khi tạo Intent URL:", error);
                // Fallback an toàn: Nếu API lỗi, vẫn cho user ấn link gốc
                enableButton(btn, btnText, btnIcon, loader, ORIGINAL_URL, "Mở App Ngân Hàng Ngay");
            }
        }

        // Hàm hỗ trợ bật lại nút sau khi loading xong
        function enableButton(btn, btnText, btnIcon, loader, href, text) {
            btn.href = href;
            btnText.textContent = text;
            
            // Xóa các class khóa nút
            btn.classList.remove('opacity-70', 'cursor-not-allowed', 'pointer-events-none');
            
            // Ẩn icon loading, hiện mũi tên
            loader.classList.add('hidden');
            btnIcon.classList.remove('hidden');
        }

        // Chạy setup ngay khi DOM tải xong
        document.addEventListener('DOMContentLoaded', setupPaymentLink);
    </script>
</body>
</html>
