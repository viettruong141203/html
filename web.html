<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trình Duyệt Web Trực Tiếp</title>
  <style>
    body { margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; height: 100vh; overflow: hidden; background-color: #000; }
    
    /* Khung iframe chiếm toàn màn hình */
    .iframe-container { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }
    iframe { width: 100%; height: 100%; border: none; background: #fff;}

    /* Nút Menu nổi trong suốt */
    .menu-btn {
      position: fixed;
      top: 15px; left: 15px; z-index: 101;
      background: rgba(47, 54, 64, 0.5); /* Nền bán trong suốt */
      backdrop-filter: blur(5px);
      color: white; border: none; padding: 10px 15px;
      border-radius: 6px; cursor: pointer;
      font-weight: bold; font-size: 16px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.2);
      transition: background 0.3s;
    }
    .menu-btn:hover { background: rgba(47, 54, 64, 0.8); }

    /* Thanh điều hướng (Sidebar) với nền trong suốt (Glassmorphism) */
    .sidebar { 
      position: fixed; top: 0; left: -320px; /* Ẩn đi mặc định */
      width: 300px; height: 100vh; 
      background: rgba(30, 39, 46, 0.85); /* Trong suốt nhẹ */
      backdrop-filter: blur(8px);
      color: white; display: flex; flex-direction: column; z-index: 100;
      box-shadow: 5px 0 15px rgba(0,0,0,0.3);
      transition: left 0.3s ease-in-out;
    }
    .sidebar.open { left: 0; } /* Class thêm vào để hiện menu */

    .sidebar-header { padding: 20px 20px 10px 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;}
    .sidebar-header h3 { margin: 0; font-size: 16px; text-transform: uppercase; width: 100%; text-align: center; color: #fff;}
    
    .btn-action { color: #fff; border: none; padding: 8px 10px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 13px; flex: 1; transition: 0.2s;}
    .btn-add { background-color: rgba(225, 177, 44, 0.9); }
    .btn-add:hover { background-color: #e1b12c; }
    .btn-refresh { background-color: rgba(0, 151, 230, 0.9); }
    .btn-refresh:hover { background-color: #0097e6; }
    .btn-close { background-color: rgba(232, 65, 24, 0.8); width: 100%; margin-top: 5px;}

    .nav-list { list-style: none; padding: 0; margin: 0; overflow-y: auto; flex: 1; }
    .nav-item { padding: 15px 20px; border-bottom: 1px solid rgba(255,255,255,0.1); cursor: pointer; transition: all 0.2s ease; font-size: 15px; }
    .nav-item:hover { background-color: rgba(0, 151, 230, 0.5); padding-left: 25px; }
    .nav-item.active { background-color: rgba(0, 168, 255, 0.7); border-left: 4px solid #fff; }
    .loading-text { padding: 20px; text-align: center; color: #ccc; font-style: italic; font-size: 14px;}

    /* Modal Thêm dữ liệu */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: none; justify-content: center; align-items: center; z-index: 105; }
    .modal { background: #fff; padding: 25px; border-radius: 8px; width: 90%; max-width: 400px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
    .modal h3 { margin-top: 0; margin-bottom: 20px; color: #333; text-align: center; }
    .modal label { display: block; margin-bottom: 8px; font-weight: bold; color: #555; font-size: 14px;}
    .modal input { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    .modal-actions { display: flex; justify-content: space-between; gap: 10px;}
    .btn-save { flex: 1; padding: 10px; background: #0097e6; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;}
    .btn-cancel { flex: 1; padding: 10px; background: #e84118; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;}
  </style>
</head>
<body>

  <!-- Nút Menu Bật/Tắt Sidebar -->
  <button class="menu-btn" onclick="toggleSidebar()">☰ MENU</button>

  <!-- Thanh điều hướng ẩn (Sidebar) -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h3>Danh Sách Trang</h3>
      <button class="btn-action btn-add" onclick="openModal()">+ THÊM</button>
      <button class="btn-action btn-refresh" onclick="fetchData()">🔄 TẢI LẠI</button>
      <button class="btn-action btn-close" onclick="toggleSidebar()">✖ ĐÓNG</button>
    </div>
    <ul class="nav-list" id="navList">
      <li class="loading-text" id="loadingMsg">Đang tải dữ liệu...</li>
    </ul>
  </div>

  <!-- Khung nội dung Full Màn Hình -->
  <div class="iframe-container">
    <iframe id="contentFrame" src="" allowfullscreen></iframe>
  </div>

  <!-- Popup Modal Thêm Trang Mới -->
  <div class="modal-overlay" id="addModal">
    <div class="modal">
      <h3>Thêm Trang Mới</h3>
      <label>Tên trang:</label>
      <input type="text" id="newName" placeholder="VD: Liên hệ">
      <label>Đường dẫn (URL):</label>
      <input type="url" id="newUrl" placeholder="VD: https://link-cua-ban.html">
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeModal()">Hủy bỏ</button>
        <button class="btn-save" id="btnSave" onclick="saveData()">Lưu vào Sheet</button>
      </div>
    </div>
  </div>

  <script>
    // URL API của bạn
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzU2-uP0jUUia8w74BBQ7U78OUn3d_SE7cEd_LBZJbq2b2g4HCJyFRAOLKMU9p2zb0F/exec"; 

    // Biến lưu trữ URL đang chọn (để phục vụ code sau này nếu cần copy)
    let currentActiveUrl = "";

    fetchData();

    // Hàm Bật/Tắt Sidebar
    function toggleSidebar() {
      const sidebar = document.getElementById("sidebar");
      sidebar.classList.toggle("open");
    }

    async function fetchData() {
      const navList = document.getElementById("navList");
      navList.innerHTML = "<li class='loading-text'>Đang kết nối API...</li>";
      
      try {
        const requestPayload = {
          "sheet": "Home",
          "action": "get"
        };

        const response = await fetch(SCRIPT_URL, {
            method: "POST",
            headers: {
              "Content-Type": "text/plain;charset=utf-8"
            },
            body: JSON.stringify(requestPayload),
            redirect: "follow"
        });
        
        const data = await response.json();
        
        if (data.status !== "success") {
          navList.innerHTML = `<li class='loading-text' style='color:#ff7675;'>Lỗi Sheet: ${data.message || 'Không xác định'}</li>`;
          return;
        }
        
        const pages = [];
        if (data.all_data && Array.isArray(data.all_data)) {
          data.all_data.forEach(item => {
            if (item.row !== 1 && item.A && item.B) {
              pages.push({ name: item.A, url: item.B });
            }
          });
        }
        
        renderNavigation(pages);
      } catch (error) {
        navList.innerHTML = "<li class='loading-text' style='color:#ff7675;'>Lỗi kết nối mạng.</li>";
      }
    }

    function renderNavigation(pages) {
      const navList = document.getElementById("navList");
      navList.innerHTML = ""; 
      if(pages.length === 0) {
         navList.innerHTML = "<li class='loading-text'>Sheet 'Home' đang trống</li>";
         return;
      }
      pages.forEach(page => {
        const li = document.createElement("li");
        li.className = "nav-item";
        li.textContent = page.name;
        li.onclick = () => loadWebPage(page.url, li);
        navList.appendChild(li);
      });
    }

    // Cập nhật iframe và Tự động ẩn Sidebar khi chọn trang
    function loadWebPage(url, element) {
      document.querySelectorAll(".nav-item").forEach(item => item.classList.remove("active"));
      element.classList.add("active");
      
      currentActiveUrl = url;
      document.getElementById("contentFrame").src = url;
      
      // Đóng menu sau khi chọn để không che màn hình web
      toggleSidebar(); 
    }

    function openModal() {
      document.getElementById("newName").value = "";
      document.getElementById("newUrl").value = "";
      document.getElementById("addModal").style.display = "flex";
      toggleSidebar(); // Ẩn sidebar khi mở form thêm
    }

    function closeModal() {
      document.getElementById("addModal").style.display = "none";
    }

    async function saveData() {
      const name = document.getElementById("newName").value.trim();
      const url = document.getElementById("newUrl").value.trim();
      const btnSave = document.getElementById("btnSave");

      if (!name || !url) return alert("Vui lòng nhập đủ thông tin!");

      btnSave.textContent = "Đang lưu...";
      btnSave.disabled = true;

      try {
        const savePayload = { 
          "sheet": "Home", 
          "action": "post", 
          "A": name, 
          "B": url 
        };

        const response = await fetch(SCRIPT_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(savePayload),
          redirect: "follow"
        });

        const result = await response.json();
        if (result.status === "success") {
          alert("Thêm dữ liệu thành công!");
          closeModal();
          // Bật lại sidebar và load lại dữ liệu
          toggleSidebar();
          fetchData(); 
        } else {
          alert("Lỗi từ server: " + (result.message || "Không xác định"));
        }
      } catch (error) {
        alert("Lỗi khi Lưu. Xin hãy thử lại!");
      } finally {
        btnSave.textContent = "Lưu vào Sheet";
        btnSave.disabled = false;
      }
    }
  </script>
</body>
</html>
