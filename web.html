<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Xác nhận thanh toán</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6; /* Nền xám nhạt giúp nổi bật card */
            -webkit-tap-highlight-color: transparent;
        }
        .pulse-btn {
            animation: pulse-shadow 2s infinite;
        }
        @keyframes pulse-shadow {
            0% { box-shadow: 0 0 0 0 rgba(13, 92, 182, 0.4); }
            70% { box-shadow: 0 0 0 12px rgba(13, 92, 182, 0); }
            100% { box-shadow: 0 0 0 0 rgba(13, 92, 182, 0); }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <!-- Payment Card Container -->
    <div class="bg-white w-full max-w-md rounded-3xl shadow-xl overflow-hidden border border-gray-100">
        
        <!-- Header (Màu xanh đặc trưng của ngân hàng) -->
        <div class="bg-[#0D5CB6] px-6 py-8 text-center relative overflow-hidden">
            <!-- Background pattern (tùy chọn) -->
            <div class="absolute inset-0 opacity-10" style="background-image: radial-gradient(circle at 2px 2px, white 1px, transparent 0); background-size: 16px 16px;"></div>
            
            <div class="relative z-10 flex flex-col items-center">
                <div class="w-16 h-16 bg-white rounded-full flex items-center justify-center mb-3 shadow-md">
                    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#0D5CB6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                        <polyline points="22 4 12 14.01 9 11.01"></polyline>
                    </svg>
                </div>
                <h1 class="text-white text-lg font-medium opacity-90">Xác nhận thanh toán</h1>
                <p class="text-white text-3xl font-bold mt-1">2,000 VND</p>
            </div>
        </div>

        <!-- Order Details -->
        <div class="p-6">
            <h2 class="text-sm font-semibold text-gray-800 mb-4 uppercase tracking-wider">Thông tin giao dịch</h2>
            
            <div class="space-y-4 text-sm">
                <!-- Dòng thông tin 1 -->
                <div class="flex justify-between items-center border-b border-gray-100 pb-3">
                    <span class="text-gray-500">Ngân hàng nhận</span>
                    <span class="font-semibold text-gray-800 text-right">MBBank</span>
                </div>
                
                <!-- Dòng thông tin 2 -->
                <div class="flex justify-between items-center border-b border-gray-100 pb-3">
                    <span class="text-gray-500">Số tài khoản</span>
                    <span class="font-mono font-semibold text-gray-800 text-right text-base">2000</span>
                </div>
                
                <!-- Dòng thông tin 3 -->
                <div class="flex flex-col gap-1 border-b border-gray-100 pb-3">
                    <span class="text-gray-500">Nội dung chuyển khoản</span>
                    <span class="font-medium text-gray-800 bg-gray-50 p-2 rounded-lg break-words">tra tien tra sua cho bo</span>
                </div>
            </div>

            <!-- Nút Action (QUAN TRỌNG: Không dùng target="_blank") -->
            <div class="mt-8">
                <a 
                    href="https://dl.vietqr.io/pay?app=icb&am=2000&tn=tra+tien+tra+sua+cho+bo&ba=2000@MB&url=https://www.vietqr.io/deeplink" 
                    class="pulse-btn w-full flex items-center justify-center py-4 px-4 bg-[#0D5CB6] hover:bg-blue-800 text-white text-base font-bold rounded-xl transition-colors shadow-lg shadow-blue-500/30"
                >
                    Mở App VietinBank Ngay
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="ml-2">
                        <path d="M5 12h14"></path>
                        <path d="m12 5 7 7-7 7"></path>
                    </svg>
                </a>
            </div>

            <!-- Footer / Hướng dẫn -->
            <div class="mt-5 text-center">
                <p class="text-xs text-gray-500">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="inline-block mr-1 -mt-0.5"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                    Hệ thống sẽ tự động mở ứng dụng ngân hàng trên máy bạn. Vui lòng kiểm tra lại thông tin trước khi xác nhận trên App.
                </p>
            </div>
        </div>
    </div>

</body>
</html>
