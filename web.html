<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trình Duyệt Web Toàn Màn Hình</title>
  <style>
    :root {
      --bg-sidebar: rgba(24, 28, 33, 0.95);
      --primary: #3498db;
      --text-light: #f5f6fa;
    }
    
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; height: 100vh; overflow: hidden; background-color: #0f1115; }
    
    /* Khung iframe toàn màn hình */
    .iframe-container { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; display: flex; justify-content: center; align-items: center; color: #555;}
    .iframe-container span.placeholder { font-size: 16px; font-style: italic; opacity: 0.7; }
    iframe { width: 100%; height: 100%; border: none; background: #fff; position: relative; z-index: 2;}

    /* Cụm 2 icon nổi dạng SVG (Trong suốt, không khung tròn) */
    .floating-controls {
      position: fixed; top: 20px; left: 20px; z-index: 100;
      display: flex; gap: 15px; align-items: center;
    }

    .float-btn {
      background: none; border: none; padding: 0; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.25s ease;
      filter: drop-shadow(0 2px 6px rgba(0,0,0,0.6)); /* Đổ bóng giúp icon nổi bật trên mọi nền */
    }

    .float-btn svg {
      width: 26px; height: 26px;
      fill: none;
      stroke: rgba(255, 255, 255, 0.85); /* Màu trắng mờ tinh tế */
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: all 0.25s ease;
    }
    
    .float-btn:hover svg { 
      stroke: #3498db; /* Đổi sang màu xanh khi rê chuột */
      transform: scale(1.15); 
    }

    /* Lớp phủ làm tối màn hình khi mở menu */
    .overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.4); z-index: 101;
      opacity: 0; visibility: hidden; transition: 0.3s;
    }
    .overlay.show { opacity: 1; visibility: visible; }

    /* Thanh điều hướng tối giản */
    .sidebar { 
      position: fixed; top: 0; left: -320px; width: 280px; height: 100vh; 
      background: var(--bg-sidebar); backdrop-filter: blur(10px);
      color: var(--text-light); display: flex; flex-direction: column; z-index: 102;
      box-shadow: 5px 0 20px rgba(0,0,0,0.5); transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .sidebar.open { left: 0; }

    .sidebar-header { padding: 25px 20px 15px; display: flex; flex-direction: column; gap: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .header-top { display: flex; justify-content: space-between; align-items: center; }
    .header-top h3 { margin: 0; font-size: 16px; font-weight: 600; letter-spacing: 0.5px; }
    .close-btn { background: none; border: none; color: #aaa; font-size: 20px; cursor: pointer; padding: 0; transition: color 0.2s; }
    .close-btn:hover { color: #fff; }

    .action-buttons { display: flex; gap: 10px; }
    .btn-action { 
      flex: 1; padding: 8px; border: none; border-radius: 20px; 
      font-size: 13px; font-weight: 600; cursor: pointer; color: #fff; transition: 0.2s; 
    }
    .btn-add { background: var(--primary); }
    .btn-add:hover { background: #2980b9; }
    .btn-refresh { background: rgba(255,255,255,0.1); }
    .btn-refresh:hover { background: rgba(255,255,255,0.2); }

    .nav-list { list-style: none; padding: 10px 0; margin: 0; overflow-y: auto; flex: 1; }
    .nav-item { 
      padding: 12px 20px; margin: 4px 10px; border-radius: 8px;
      cursor: pointer; transition: 0.2s; font-size: 14px;
      display: flex; align-items: center; gap: 10px;
    }
    .nav-item::before { content: "•"; color: #555; font-size: 18px; }
    .nav-item:hover { background: rgba(255,255,255,0.05); }
    .nav-item.active { background: rgba(52, 152, 219, 0.15); color: var(--primary); font-weight: 500; }
    .nav-item.active::before { color: var(--primary); }
    
    .loading-text { padding: 20px; text-align: center; color: #7f8c8d; font-size: 13px; }

    /* Modal Form tối giản */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); backdrop-filter: blur(3px); display: none; justify-content: center; align-items: center; z-index: 105; }
    .modal { background: #fff; padding: 30px; border-radius: 16px; width: 85%; max-width: 360px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
    .modal h3 { margin: 0 0 20px 0; color: #2c3e50; text-align: center; font-size: 18px; }
    .modal label { display: block; margin-bottom: 6px; font-weight: 500; color: #7f8c8d; font-size: 13px;}
    .modal input { width: 100%; padding: 12px; margin-bottom: 20px; border: 1px solid #dfe6e9; border-radius: 8px; box-sizing: border-box; font-size: 14px; outline: none; transition: border 0.2s;}
    .modal input:focus { border-color: var(--primary); }
    
    .modal-actions { display: flex; gap: 12px;}
    .btn-save { flex: 1; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 14px;}
    .btn-cancel { flex: 1; padding: 12px; background: #ecf0f1; color: #7f8c8d; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 14px;}
  </style>
</head>
<body>

  <!-- Cụm 2 icon SVG cao cấp, trong suốt -->
  <div class="floating-controls">
    <!-- Icon Menu (3 gạch ngang mềm mại) -->
    <button class="float-btn" onclick="openSidebar()" title="Mở menu">
      <svg viewBox="0 0 24 24"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
    </button>
    <!-- Icon Phóng to toàn màn hình (Khung mở rộng) -->
    <button class="float-btn" onclick="toggleFullScreen()" title="Phóng to toàn màn hình">
      <svg viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
    </button>
  </div>

  <!-- Lớp phủ màn hình -->
  <div class="overlay" id="pageOverlay" onclick="closeSidebar()"></div>

  <!-- Thanh điều hướng ẩn (Sidebar) -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="header-top">
        <h3>Menu Trang</h3>
        <button class="close-btn" onclick="closeSidebar()">✕</button>
      </div>
      <div class="action-buttons">
        <button class="btn-action btn-add" onclick="openModal()">+ Thêm Mới</button>
        <button class="btn-action btn-refresh" onclick="fetchData()">↻ Tải Lại</button>
      </div>
    </div>
    <ul class="nav-list" id="navList">
      <li class="loading-text">Đang tải dữ liệu...</li>
    </ul>
  </div>

  <!-- Khung nội dung Full Màn Hình -->
  <div class="iframe-container" id="containerScreen">
    <span class="placeholder">Vui lòng chọn một trang từ menu...</span>
    <iframe id="contentFrame" src="" allowfullscreen style="display: none;"></iframe>
  </div>

  <!-- Popup Form Thêm -->
  <div class="modal-overlay" id="addModal">
    <div class="modal">
      <h3>Thêm Trang Mới</h3>
      <label>Tên hiển thị</label>
      <input type="text" id="newName" placeholder="Nhập tên trang...">
      <label>Đường dẫn (URL)</label>
      <input type="url" id="newUrl" placeholder="https://...">
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeModal()">Hủy</button>
        <button class="btn-save" id="btnSave" onclick="saveData()">Lưu Lại</button>
      </div>
    </div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzU2-uP0jUUia8w74BBQ7U78OUn3d_SE7cEd_LBZJbq2b2g4HCJyFRAOLKMU9p2zb0F/exec"; 

    openSidebar();
    fetchData();

    function toggleFullScreen() {
      const elem = document.documentElement;
      if (!document.fullscreenElement) {
        if (elem.requestFullscreen) {
          elem.requestFullscreen();
        } else if (elem.webkitRequestFullscreen) { /* Safari */
          elem.webkitRequestFullscreen();
        } else if (elem.msRequestFullscreen) { /* IE11 */
          elem.msRequestFullscreen();
        }
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        } else if (document.webkitExitFullscreen) {
          document.webkitExitFullscreen();
        } else if (document.msExitFullscreen) {
          document.msExitFullscreen();
        }
      }
    }

    function openSidebar() {
      document.getElementById("sidebar").classList.add("open");
      document.getElementById("pageOverlay").classList.add("show");
    }

    function closeSidebar() {
      document.getElementById("sidebar").classList.remove("open");
      document.getElementById("pageOverlay").classList.remove("show");
    }

    function openModal() {
      document.getElementById("newName").value = "";
      document.getElementById("newUrl").value = "";
      document.getElementById("addModal").style.display = "flex";
      closeSidebar(); 
    }

    function closeModal() {
      document.getElementById("addModal").style.display = "none";
    }

    async function fetchData() {
      const navList = document.getElementById("navList");
      navList.innerHTML = "<li class='loading-text'>Đang kết nối...</li>";
      
      try {
        const requestPayload = { "sheet": "Home", "action": "get" };
        const response = await fetch(SCRIPT_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify(requestPayload),
            redirect: "follow"
        });
        
        const data = await response.json();
        
        if (data.status !== "success") {
          navList.innerHTML = `<li class='loading-text' style='color:#e74c3c;'>Lỗi: ${data.message || 'Không xác định'}</li>`;
          return;
        }
        
        const pages = [];
        if (data.all_data && Array.isArray(data.all_data)) {
          data.all_data.forEach(item => {
            if (item.row !== 1 && item.A && item.B) {
              pages.push({ name: item.A, url: item.B });
            }
          });
        }
        
        renderNavigation(pages);
      } catch (error) {
        navList.innerHTML = "<li class='loading-text' style='color:#e74c3c;'>Lỗi kết nối mạng.</li>";
      }
    }

    function renderNavigation(pages) {
      const navList = document.getElementById("navList");
      navList.innerHTML = ""; 
      if(pages.length === 0) {
         navList.innerHTML = "<li class='loading-text'>Danh sách trống</li>";
         return;
      }
      pages.forEach(page => {
        const li = document.createElement("li");
        li.className = "nav-item";
        li.textContent = page.name;
        li.onclick = () => loadWebPage(page.url, li);
        navList.appendChild(li);
      });
    }

    function loadWebPage(url, element) {
      document.querySelectorAll(".nav-item").forEach(item => item.classList.remove("active"));
      element.classList.add("active");
      
      const iframe = document.getElementById("contentFrame");
      const placeholder = document.querySelector(".placeholder");
      
      placeholder.style.display = "none";
      iframe.src = url;
      iframe.style.display = "block";
      
      closeSidebar(); 
    }

    async function saveData() {
      const name = document.getElementById("newName").value.trim();
      const url = document.getElementById("newUrl").value.trim();
      const btnSave = document.getElementById("btnSave");

      if (!name || !url) return alert("Vui lòng nhập đủ thông tin!");

      btnSave.textContent = "Đang lưu...";
      btnSave.disabled = true;

      try {
        const savePayload = { 
          "sheet": "Home", 
          "action": "add", 
          "A": name, 
          "B": url 
        };

        const response = await fetch(SCRIPT_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(savePayload),
          redirect: "follow"
        });

        const result = await response.json();
        
        if (result.status === "success" || result.message === "Thành công") {
          closeModal();
          openSidebar();
          fetchData(); 
        } else {
          alert("Lỗi từ máy chủ: " + (result.message || "Không xác định"));
        }
      } catch (error) {
        alert("Lỗi kết nối. Xin hãy thử lại!");
      } finally {
        btnSave.textContent = "Lưu Lại";
        btnSave.disabled = false;
      }
    }
  </script>
</body>
</html>
